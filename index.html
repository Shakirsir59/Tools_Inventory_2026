<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Region Asset Inventory Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; margin-top: 0; }
        .stats-cards { display: flex; gap: 20px; margin-bottom: 25px; }
        .card { flex: 1; background: #ffffff; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .card .number { font-size: 28px; font-weight: bold; color: #0f172a; }
        .card .label { font-size: 13px; font-weight: 600; color: #64748b; text-transform: uppercase; }
        .form-section { background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px; }
        select:focus, input:focus { border-color: #0f766e; }
        .btn-submit { background: #0f172a; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-submit:hover { background: #1e293b; }
        .btn-danger { background: #dc2626; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>North Region Asset Inventory</h2>

    <!-- Form Section -->
    <div class="form-section">
        <h3>🌱 Register / Modify Asset Record</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Employee Name</label>
                <select id="employeeSelect">
                    <option value="">-- Select Employee --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Asset Category</label>
                <select id="assetCategory">
                    <option value="">-- Select Category --</option>
                    <option value="Telecom Hardware">Telecom Hardware</option>
                    <option value="Rigger Safety">Rigger Safety</option>
                    <option value="Tools & Equipment">Tools & Equipment</option>
                </select>
            </div>
            <div class="form-group">
                <label>Model / Tool Name</label>
                <input type="text" id="modelName" placeholder="e.g. Samsung S22 or Laptop Bag">
            </div>
            <div class="form-group">
                <label>Serial / IMEI / Quantity</label>
                <input type="text" id="serialNo" placeholder="e.g. 5CG2421T3F or 1">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="assetStatus">
                    <option value="Working">Working</option>
                    <option value="Available">Available</option>
                    <option value="OLD">OLD</option>
                    <option value="Need New">Need New</option>
                    <option value="Damage">Damage</option>
                    <option value="Not Issued">Not Issued</option>
                </select>
            </div>
        </div>
        <button class="btn-submit" onclick="saveAssetRecord()">Update Live</button>
    </div>
</div>

<script>
    // 1. Firebase Configuration (Apni Firebase Config details yahan verify karein)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const SECURE_PASSWORD = "admin123";

    // 2. Load Employee Dropdown (Filters out 'admin123' & Handles Add/Delete)
    function loadEmployeeDropdown() {
        db.ref('inventory').on('value', snapshot => {
            const dropdown = document.getElementById("employeeSelect");
            dropdown.innerHTML = '<option value="">-- Select Employee --</option>';

            let employeeSet = new Set();

            snapshot.forEach(child => {
                const data = child.val();
                if (data['Employee Name']) {
                    employeeSet.add(data['Employee Name'].trim());
                }
            });

            // Clean list: Skip 'admin123' and blank names
            employeeSet.forEach(emp => {
                if (emp && emp !== "admin123") {
                    const option = document.createElement("option");
                    option.value = emp;
                    option.textContent = emp;
                    dropdown.appendChild(option);
                }
            });

            // Special Options at the bottom
            const addOpt = document.createElement("option");
            addOpt.value = "ADD_NEW";
            addOpt.textContent = "+ Add New Employee...";
            dropdown.appendChild(addOpt);

            const delOpt = document.createElement("option");
            delOpt.value = "DELETE_EMP";
            delOpt.textContent = "🗑️ Delete Staff Member...";
            dropdown.appendChild(delOpt);
        });
    }

    // 3. Handle Dropdown Selections (Adding & Deleting Staff)
    document.getElementById("employeeSelect").addEventListener("change", function(e) {
        const val = e.target.value;

        // Add New Staff
        if (val === "ADD_NEW") {
            const newName = prompt("Enter New Employee Full Name:");
            if (newName && newName.trim() !== "" && newName.trim() !== "admin123") {
                const option = document.createElement("option");
                option.value = newName.trim();
                option.textContent = newName.trim();
                e.target.insertBefore(option, e.target.lastElementChild.previousElementSibling);
                e.target.value = newName.trim();
            } else {
                alert("Invalid Employee Name!");
                e.target.value = "";
            }
        }

        // Delete Existing Staff & All Their Records
        if (val === "DELETE_EMP") {
            const empToDelete = prompt("Type EXACT Employee Name to Delete (e.g., Ex-Employee Name):");
            if (empToDelete) {
                const pass = prompt("Enter Admin Password:");
                if (pass === SECURE_PASSWORD) {
                    db.ref('inventory').once('value', snapshot => {
                        let deletedCount = 0;
                        snapshot.forEach(child => {
                            if (child.val()['Employee Name'] === empToDelete) {
                                child.ref.remove();
                                deletedCount++;
                            }
                        });
                        alert(`Successfully removed "${empToDelete}" (${deletedCount} assets deleted).`);
                        location.reload();
                    });
                } else {
                    alert("Incorrect Password!");
                    e.target.value = "";
                }
            } else {
                e.target.value = "";
            }
        }
    });

    // 4. Save/Update Asset Record
    function saveAssetRecord() {
        const empName = document.getElementById("employeeSelect").value;
        const category = document.getElementById("assetCategory").value;
        const model = document.getElementById("modelName").value;
        const serial = document.getElementById("serialNo").value;
        const status = document.getElementById("assetStatus").value;

        if (!empName || empName === "ADD_NEW" || empName === "DELETE_EMP" || !model) {
            alert("Please select a valid Employee Name and fill in Model/Tool Name!");
            return;
        }

        const newAsset = {
            "Employee Name": empName,
            "Asset Category": category,
            "Model/Tool Name": model,
            "Serial/IMEI/Quantity": serial,
            "Status": status
        };

        db.ref('inventory').push(newAsset).then(() => {
            alert("Asset Record Saved Successfully!");
            document.getElementById("modelName").value = "";
            document.getElementById("serialNo").value = "";
        });
    }

    // Run on Page Load
    window.onload = function() {
        loadEmployeeDropdown();
    };
</script>

</body>
</html>
