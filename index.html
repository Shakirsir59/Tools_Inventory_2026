<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Region Asset Inventory Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Aapki CSS Styles Yahan Hingi */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        select, input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .danger-btn { background-color: #dc3545; }
        .danger-btn:hover { background-color: #bd2130; }
    </style>
</head>
<body>

<div class="container">
    <h2>Register / Modify Asset Record</h2>

    <div class="form-group">
        <label for="employeeSelect">Employee Name</label>
        <select id="employeeSelect">
            <option value="">-- Select Employee --</option>
        </select>
    </div>

    <!-- Rest of your Asset Form Fields (Category, Model, Serial, Status etc.) -->
</div>

<script>
    // 1. Firebase Configuration (Apni Config Details Yahan Rakhein)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const SECURE_PASSWORD = "admin123";

    // 2. Load & Filter Employees Dropdown
    function loadEmployeeDropdown() {
        db.ref('inventory').on('value', snapshot => {
            const dropdown = document.getElementById("employeeSelect");
            dropdown.innerHTML = '<option value="">-- Select Employee --</option>';

            let employeeSet = new Set();

            snapshot.forEach(child => {
                const data = child.val();
                if (data['Employee Name']) {
                    employeeSet.add(data['Employee Name']);
                }
            });

            // Clean list: Skip 'admin123' and blank names
            employeeSet.forEach(emp => {
                if (emp && emp.trim() !== "admin123") {
                    const option = document.createElement("option");
                    option.value = emp;
                    option.textContent = emp;
                    dropdown.appendChild(option);
                }
            });

            // Special Options
            const addOpt = document.createElement("option");
            addOpt.value = "ADD_NEW";
            addOpt.textContent = "+ Add New Employee...";
            dropdown.appendChild(addOpt);

            const delOpt = document.createElement("option");
            delOpt.value = "DELETE_EMP";
            delOpt.textContent = "🗑️ Delete Employee...";
            dropdown.appendChild(delOpt);
        });
    }

    // 3. Dropdown Event Listener (Add & Delete Actions)
    document.getElementById("employeeSelect").addEventListener("change", function(e) {
        const selectedValue = e.target.value;

        // --- ADD NEW EMPLOYEE ---
        if (selectedValue === "ADD_NEW") {
            const newEmp = prompt("Enter New Employee Full Name:");
            if (newEmp && newEmp.trim() !== "" && newEmp !== "admin123") {
                // Add dummy record or refresh dropdown with new name
                alert(`Employee "${newEmp}" ready to assign assets!`);
                const option = document.createElement("option");
                option.value = newEmp;
                option.textContent = newEmp;
                e.target.insertBefore(option, e.target.lastElementChild.previousElementSibling);
                e.target.value = newEmp;
            } else {
                alert("Invalid Employee Name!");
                e.target.value = "";
            }
        }

        // --- DELETE EMPLOYEE ---
        if (selectedValue === "DELETE_EMP") {
            const empToDelete = prompt("Type EXACT Employee Name to Delete (e.g., admin123 or Ex-Employee):");
            if (empToDelete) {
                const pass = prompt("Enter Admin Password:");
                if (pass === SECURE_PASSWORD) {
                    db.ref('inventory').once('value', snapshot => {
                        let deletedCount = 0;
                        snapshot.forEach(child => {
                            if (child.val()['Employee Name'] === empToDelete) {
                                child.ref.remove();
                                deletedCount++;
                            }
                        });
                        alert(`Successfully removed "${empToDelete}" (${deletedCount} records deleted).`);
                        location.reload();
                    });
                } else {
                    alert("Incorrect Password!");
                    e.target.value = "";
                }
            } else {
                e.target.value = "";
            }
        }
    });

    // Run on page load
    window.onload = function() {
        loadEmployeeDropdown();
    };
</script>

</body>
</html>
