<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Region Asset Inventory Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">North Region Asset Inventory</h1>
                <p class="text-xs text-gray-500">Real-time Live Sync Team Dashboard</p>
            </div>
            <div id="connectionStatus" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Sync Active
            </div>
        </div>

        <!-- Form Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2 mb-4">
                <span>🌱</span> Register / Modify Asset Record
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
                
                <!-- Employee Dropdown -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Employee Name</label>
                    <select id="employeeSelect" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-600">
                        <option value="">-- Select Employee --</option>
                    </select>
                </div>

                <!-- Asset Category -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Asset Category</label>
                    <select id="assetCategory" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-600">
                        <option value="">-- Select Category --</option>
                        <option value="Telecom Hardware">Telecom Hardware</option>
                        <option value="Rigger Safety">Rigger Safety</option>
                        <option value="Tools & Equipment">Tools & Equipment</option>
                    </select>
                </div>

                <!-- Model / Tool Name -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Model / Tool Name</label>
                    <input type="text" id="modelName" placeholder="e.g. Samsung S22, Laptop" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <!-- Serial / IMEI / Quantity -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Serial / IMEI / Quantity</label>
                    <input type="text" id="serialNo" placeholder="e.g. 5CG2421T3F or 1" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <!-- Status Dropdown -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Status</label>
                    <select id="assetStatus" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-600">
                        <option value="Working">Working</option>
                        <option value="Available">Available</option>
                        <option value="OLD">OLD</option>
                        <option value="Need New">Need New</option>
                        <option value="Damage">Damage</option>
                        <option value="Not Issued">Not Issued</option>
                    </select>
                </div>

            </div>

            <!-- Submit Button -->
            <button onclick="saveAssetRecord()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                Save & Update Live
            </button>
        </div>

        <!-- Full Team Assets Master Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <span>👥</span> Team Inventory Master List
                </h2>
                <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="🔍 Search employee, tool, or serial..." class="border border-gray-300 rounded-lg text-sm px-3 py-1.5 focus:outline-none focus:border-emerald-600 w-64">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase">
                            <th class="p-3">Employee Name</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Model / Tool Name</th>
                            <th class="p-3">Serial / IMEI / Qty</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="assetsTableBody" class="text-sm divide-y divide-gray-100">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-400">Loading live data from Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Section -->
    <script>
        const initialEmployees = [
            "Majid Mubarak Mohammed",
            "Amer Mohammed",
            "Yasir Nadeem",
            "Saeed Iqbal",
            "Muhammad Sajawal",
            "Fuaad Alnakhli",
            "Majed AlHarbi",
            "Naveed Ahmad"
        ];

        let db;
        let globalInventoryData = {};

        // 1. Populate Dropdown
        function populateDropdown(data) {
            const dropdown = document.getElementById("employeeSelect");
            const currentSelected = dropdown.value;
            dropdown.innerHTML = '<option value="">-- Select Employee --</option>';

            let employeeSet = new Set(initialEmployees);

            if (data) {
                Object.values(data).forEach(item => {
                    if (item && item['Employee Name']) {
                        const name = item['Employee Name'].trim();
                        if (name && name !== "admin123") {
                            employeeSet.add(name);
                        }
                    }
                });
            }

            employeeSet.forEach(emp => {
                if (emp && emp !== "admin123") {
                    const option = document.createElement("option");
                    option.value = emp;
                    option.textContent = emp;
                    dropdown.appendChild(option);
                }
            });

            const addOpt = document.createElement("option");
            addOpt.value = "ADD_NEW";
            addOpt.textContent = "+ Add New Employee...";
            dropdown.appendChild(addOpt);

            const delOpt = document.createElement("option");
            delOpt.value = "DELETE_EMP";
            delOpt.textContent = "🗑️ Delete Staff Member...";
            dropdown.appendChild(delOpt);

            if (currentSelected) {
                dropdown.value = currentSelected;
            }
        }

        // 2. Firebase Real-Time Connection & Live Sync
        if (typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp({
                        databaseURL: "https://tools-inventory-2026-default-rtdb.firebaseio.com"
                    });
                }
                db = firebase.database();
                
                // Live Realtime Sync Listener (Auto Update without Refreshing)
                db.ref('inventory').on('value', snapshot => {
                    globalInventoryData = snapshot.val() || {};
                    populateDropdown(globalInventoryData);
                    renderTable(); // Update table instantly for everyone
                });
            } catch(e) {
                console.error("Firebase error:", e);
                populateDropdown(null);
            }
        } else {
            populateDropdown(null);
        }

        // 3. Render Master Table (All Employees Details Together)
        function renderTable() {
            const tableBody = document.getElementById("assetsTableBody");
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            tableBody.innerHTML = "";

            if (!globalInventoryData || Object.keys(globalInventoryData).length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">No assets found in database. Add new items above!</td></tr>`;
                return;
            }

            let count = 0;

            Object.entries(globalInventoryData).forEach(([key, item]) => {
                if (!item) return;

                const emp = (item['Employee Name'] || '').toString();
                const category = (item['Asset Category'] || '').toString();
                const model = (item['Model/Tool Name'] || '').toString();
                const serial = (item['Serial/IMEI/Quantity'] || '').toString();
                const status = (item['Status'] || '').toString();

                // Search Filter Logic
                const match = emp.toLowerCase().includes(searchQuery) || 
                              category.toLowerCase().includes(searchQuery) || 
                              model.toLowerCase().includes(searchQuery) || 
                              serial.toLowerCase().includes(searchQuery) ||
                              status.toLowerCase().includes(searchQuery);

                if (match) {
                    count++;
                    
                    // Status badge color coding
                    let statusColor = "bg-gray-100 text-gray-700";
                    if (status === "Working") statusColor = "bg-emerald-100 text-emerald-700";
                    else if (status === "Need New" || status === "Damage") statusColor = "bg-red-100 text-red-700";
                    else if (status === "Available" || status === "OLD") statusColor = "bg-amber-100 text-amber-700";

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-50 border-b border-gray-100 transition";
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-slate-800">${emp}</td>
                        <td class="p-3 text-slate-600">${category || '-'}</td>
                        <td class="p-3 font-medium text-slate-800">${model || '-'}</td>
                        <td class="p-3 text-slate-600 font-mono text-xs">${serial || '-'}</td>
                        <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${status || 'N/A'}</span></td>
                        <td class="p-3 text-right">
                            <button onclick="deleteAssetRecord('${key}')" class="text-red-500 hover:text-red-700 text-xs font-semibold bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition">
                                Delete
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            if (count === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">No matching record found.</td></tr>`;
            }
        }

        // 4. Save Record
        function saveAssetRecord() {
            const empName = document.getElementById("employeeSelect").value;
            const category = document.getElementById("assetCategory").value;
            const model = document.getElementById("modelName").value;
            const serial = document.getElementById("serialNo").value;
            const status = document.getElementById("assetStatus").value;

            if (!empName || empName === "ADD_NEW" || empName === "DELETE_EMP" || !model) {
                alert("Please select an Employee Name and enter Model/Tool Name!");
                return;
            }

            const newAsset = {
                "Employee Name": empName,
                "Asset Category": category,
                "Model/Tool Name": model,
                "Serial/IMEI/Quantity": serial,
                "Status": status
            };

            if (db) {
                db.ref('inventory').push(newAsset).then(() => {
                    document.getElementById("modelName").value = "";
                    document.getElementById("serialNo").value = "";
                });
            }
        }

        // 5. Delete Record
        function deleteAssetRecord(key) {
            if (confirm("Are you sure you want to delete this record?")) {
                if (db) {
                    db.ref(`inventory/${key}`).remove();
                }
            }
        }

        // Dropdown Handlers
        document.getElementById("employeeSelect").addEventListener("change", function(e) {
            const val = e.target.value;

            if (val === "ADD_NEW") {
                const newName = prompt("Enter New Employee Full Name:");
                if (newName && newName.trim() !== "" && newName.trim() !== "admin123") {
                    const option = document.createElement("option");
                    option.value = newName.trim();
                    option.textContent = newName.trim();
                    e.target.insertBefore(option, e.target.lastElementChild.previousElementSibling);
                    e.target.value = newName.trim();
                } else {
                    alert("Invalid Employee Name!");
                    e.target.value = "";
                }
            }

            if (val === "DELETE_EMP") {
                const empToDelete = prompt("Type EXACT Employee Name to Delete:");
                if (empToDelete) {
                    const pass = prompt("Enter Admin Password:");
                    if (pass === "admin123") {
                        if (db) {
                            db.ref('inventory').once('value', snapshot => {
                                snapshot.forEach(child => {
                                    if (child.val()['Employee Name'] === empToDelete) {
                                        child.ref.remove();
                                    }
                                });
                                alert(`Deleted employee records: ${empToDelete}`);
                            });
                        }
                    } else {
                        alert("Incorrect Password!");
                        e.target.value = "";
                    }
                } else {
                    e.target.value = "";
                }
            }
        });
    </script>
</body>
</html>
